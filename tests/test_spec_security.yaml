openapi: 3.0.0
info:
  title: Security Requirements Test API
  version: 1.0.0
  description: Spec exercising global, per-operation, public, and undefined security.
servers:
  - url: https://api.example.com/v1
# Global default: every operation requires bearerAuth unless it overrides below.
security:
  - bearerAuth: []
paths:
  /users:
    # Inherits the global bearerAuth requirement (no operation-level security).
    get:
      summary: List users
      responses:
        '200':
          description: Success
  /health:
    # Explicitly public: an empty array overrides the global default.
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: OK
  /keyed:
    # Operation-level override to a different, defined scheme.
    get:
      summary: Read with API key
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Success
  /optional:
    # Anonymous access ({}) accepted alongside bearerAuth.
    get:
      summary: Optionally authenticated
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Success
  /legacy:
    # References a scheme that is not defined under securitySchemes.
    post:
      summary: Legacy endpoint
      security:
        - oldKey: []
      responses:
        '200':
          description: Success
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      name: X-API-Key
      in: header
